    </div>

    <div class="divider"></div>
    <div class="button" onclick="buttonPress()">Click to generate</div>
    <p id="success" class="info">Output copied to clipboard.</p>
    <p class="label">
      Once generated, go to WeWeb Copilot -> Import HTML and paste.
    </p>
  </body>
</html>

<script>
  function tagElement(type) {
    parent.postMessage({ pluginMessage: { type: "tag", payload: type } }, "*");
  }

  const buttonPress = () => {
    parent.postMessage({ pluginMessage: { type: "export" } }, "*");
  };

  const input = document.querySelector("input");

  input.addEventListener("change", updateValue);

  function updateValue(e) {
    parent.postMessage(
      { pluginMessage: { type: "config", payload: e.target.value } },
      "*"
    );
  }

  onmessage = (event) => {
    switch (event.data.pluginMessage.type) {
      case "export":
        unsecuredCopyToClipboard(event.data.pluginMessage.payload);
        const successMsg = document.getElementById("success");

        successMsg.style.display = "block";

        setTimeout(() => {
          successMsg.style.display = "none";
        }, 3000);
        break;
      case "verified":
        document.getElementById("beta").style.display = "none";
        break;
    }
  };

  const unsecuredCopyToClipboard = (text) => {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand("copy");
    } catch (err) {
      console.error("Unable to copy to clipboard", err);
    }
    document.body.removeChild(textArea);
  };
</script>
