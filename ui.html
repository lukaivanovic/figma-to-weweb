<!DOCTYPE html>

<html>
  <body>
    <!--
    <div>
      <span class="label">Tag element</span>
      <div class="buttons-row">
        <div class="button secondary" onclick="tagElement(`button`)">
          Button
        </div>
        <div class="button secondary" onclick="tagElement(`input`)">Input</div>
      </div>
    </div>
    
    <div class="button" onclick="buttonPress()">Mark element as</div>
    -->
    <p class="label">Watch the video tutorial</p>
    <p class="label">Want to import buttons, inputs and other elements?</p>
    <p class="info">Select a frame and select something from the dropdown.</p>

    <select id="tag" class="tagDropdown">
      <option value="" disabled selected>Mark element as</option>
      <option value="button">Button</option>
      <option value="input">Input field</option>
      <option value="image">Image</option>
      <option value="ignore">Ignore this frame</option>
    </select>

    <div class="divider"></div>

    <div id="beta">
      <span class="label"> Beta Key</span>
      <input class="betaInput" type="text" />
      <div class="divider"></div>
    </div>

    <div class="button" onclick="buttonPress()">Click to generate</div>
    <p id="success" class="info">Output copied to clipboard.</p>
  </body>
</html>

<script>
  const buttonPress = () => {
    parent.postMessage({ pluginMessage: { type: "export" } }, "*");
  };

  // const input = document.querySelector("input");
  const tag = document.querySelector(".tagDropdown");

  // input.addEventListener("change", updateValue);
  tag.addEventListener("change", tagElement, false);

  function tagElement(type) {
    console.log("fired");
    // parent.postMessage({ pluginMessage: { type: "tag", payload: type } }, "*");
    tag.selectedIndex = 0;
  }

  function updateValue(e) {
    parent.postMessage(
      { pluginMessage: { type: "config", payload: e.target.value } },
      "*"
    );
  }

  onmessage = (event) => {
    switch (event.data.pluginMessage.type) {
      case "export":
        unsecuredCopyToClipboard(event.data.pluginMessage.payload);
        const successMsg = document.getElementById("success");

        successMsg.style.display = "block";

        setTimeout(() => {
          successMsg.style.display = "none";
        }, 3000);
        break;
      case "verified":
        document.getElementById("beta").style.display = "none";
        break;
    }
  };

  const unsecuredCopyToClipboard = (text) => {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand("copy");
    } catch (err) {
      console.error("Unable to copy to clipboard", err);
    }
    document.body.removeChild(textArea);
  };
</script>
