<!DOCTYPE html>

<html>
  <body>
    <a
      class="videoBackground"
      href="https://youtu.be/PDIiADFESE8"
      target="_blank"
    >
      <img
        style="width: 34px; height: 22px"
        src="https://cdn.weweb.io/designs/80de8d5f-095a-44b6-9598-d639feace8ce/sections/video-thumbnail.png?_wwcv=1686697672954"
      />
      <span class="text2">Watch the video tutorial</span>
    </a>

    <div class="divider"></div>

    <select id="tag" class="tagDropdown">
      <option id="tagPlaceholder" value="" selected>Mark element as</option>
      <option value="Button">Button</option>
      <option value="Input">Text field</option>
      <option value="Select">Select dropdown</option>
      <option value="Image">Image</option>
      <option value="Ignore">Ignore this frame</option>
    </select>

    <button id="generateButton" class="button" onclick="buttonPress()">
      Click to generate
    </button>
    <p id="infoMessage" class="info"></p>

    <div id="beta">
      <span class="label"> Beta Key</span>
      <input id="betaInput" class="betaInput" type="text" />
    </div>
  </body>
</html>

<script>
  const generateButton = document.querySelector("button");
  const tag = document.querySelector(".tagDropdown");
  const infoMessage = document.getElementById("infoMessage");
  const dropdownSelect = document.getElementById("tag");
  const nodeTag = document.getElementById("nodeTag");
  const tagPlaceholder = document.getElementById("tagPlaceholder");
  const betaInput = document.getElementById("betaInput");

  dropdownSelect.addEventListener("change", tagElement, false);

  generateButton.disabled = true;
  dropdownSelect.disabled = true;

  onmessage = (event) => {
    switch (event.data.pluginMessage.type) {
      case "export":
        unsecuredCopyToClipboard(event.data.pluginMessage.payload);
        showInfoMessage("Output copied to clipboard.", true);
        break;
      case "verified":
        betaInput.value = event.data.pluginMessage.payload;
        break;
      case "error":
        generateButton.disabled = true;
        if (event.data.pluginMessage.payload.code === "TOO_MANY") {
          dropdownSelect.disabled = false;
        } else {
          dropdownSelect.disabled = true;
        }

        showInfoMessage(event.data.pluginMessage.payload.message, false);
        break;
      case "ok":
        generateButton.disabled = false;
        dropdownSelect.disabled = false;
        showInfoMessage(event.data.pluginMessage.payload, false);
        break;
      case "tag":
        dropdownSelect.removeEventListener("change", tagElement, false);
        console.log(event.data.pluginMessage.payload);
        if (event.data.pluginMessage.payload === "none") {
          dropdownSelect.value = "";
        } else {
          dropdownSelect.value = event.data.pluginMessage.payload;
        }

        dropdownSelect.addEventListener("change", tagElement, false);
    }
  };

  const buttonPress = () => {
    parent.postMessage(
      { pluginMessage: { type: "export", payload: betaInput.value } },
      "*"
    );
  };

  function tagElement(type) {
    console.log(dropdownSelect.value);
    parent.postMessage(
      { pluginMessage: { type: "tag", payload: dropdownSelect.value } },
      "*"
    );
  }

  function showInfoMessage(message, disappear) {
    let currentMessage = infoMessage.innerText;
    infoMessage.innerText = message;

    if (disappear) {
      setTimeout(() => {
        infoMessage.innerText = currentMessage;
      }, 1200);
    }
  }

  const unsecuredCopyToClipboard = (text) => {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand("copy");
    } catch (err) {
      console.error("Unable to copy to clipboard", err);
    }
    document.body.removeChild(textArea);
  };
</script>
