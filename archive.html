<script>
  const generateButton = document.querySelector("button");
  const tag = document.querySelector(".tagDropdown");
  const infoMessage = document.getElementById("infoMessage");
  const dropdownSelect = document.getElementById("tag");
  const nodeTag = document.getElementById("nodeTag");
  const tagPlaceholder = document.getElementById("tagPlaceholder");
  const betaInput = document.getElementById("betaInput");
  const generateTab = document.getElementById("generateTab");
  const stylesTab = document.getElementById("stylesTab");
  const codePreview = document.getElementById("code-preview");
  const selectedElement = document.getElementById("selectedElement");
  const autoLayoutNumber = document.getElementById("autoLayoutNumber");
  const groupNumber = document.getElementById("groupNumber");

  let currentTag = "none";

  // const iframe = document.getElementById("iframe");

  dropdownSelect.addEventListener("change", tagElement, false);

  generateButton.disabled = true;
  dropdownSelect.disabled = true;

  onmessage = (event) => {
    switch (event.data.pluginMessage.type) {
      case "export":
        unsecuredCopyToClipboard(event.data.pluginMessage.payload);
        showInfoMessage("Output copied to clipboard.", true);
        break;
      case "verified":
        betaInput.value = event.data.pluginMessage.payload;
        break;
      case "selection-change": {
        selectedElement.innerText = event.data.pluginMessage.payload;

        if (!event.data.pluginMessage.payload.allowGeneration) {
          generateButton.disabled = true;
          if (event.data.pluginMessage.payload.message === "TOO_MANY") {
            dropdownSelect.disabled = false;
          } else {
            dropdownSelect.disabled = true;
          }
          showInfoMessage(event.data.pluginMessage.payload.message, false);
        } else {
          generateButton.disabled = false;
          dropdownSelect.disabled = false;
          showInfoMessage(event.data.pluginMessage.payload.message, false);
        }

        autoLayoutNumber.innerText =
          event.data.pluginMessage.payload.autoLayoutNumber;
        groupNumber.innerText = event.data.pluginMessage.payload.groupNumber;

        if (currentTag !== "none") {
          document
            .getElementById(currentTag)
            .classList.toggle("tagSectionItemActive");
        }

        if (event.data.pluginMessage.payload === "none") {
          currentTag = "none";
        } else {
          const target = document.getElementById(
            event.data.pluginMessage.payload.tag
          );
          target.classList.toggle("tagSectionItemActive");
          currentTag = event.data.pluginMessage.payload.tag;
        }
        break;
      }
      case "iframe":
        break;
      case "styles":
        codePreview.innerHTML = event.data.pluginMessage.payload;
        console.log(event.data.pluginMessage.payload);
        break;

      case "export-image":
        imageExport(event.data.pluginMessage.payload);
        break;
    }
  };

  const buttonPress = (type) => {
    const styleSelector = document.getElementById("styleSelector");
    switch (type) {
      case "styles":
        parent.postMessage(
          { pluginMessage: { type: type, payload: styleSelector.value } },
          "*"
        );
        break;
      case "export":
        parent.postMessage(
          { pluginMessage: { type: type, payload: betaInput.value } },
          "*"
        );
        break;
    }
  };

  function tagElement(type) {
    if (currentTag === type) {
      parent.postMessage({ pluginMessage: { type: "tag", payload: "" } }, "*");
      currentTag = "none";
    } else {
      if (currentTag !== "none") {
        document
          .getElementById(currentTag)
          .classList.toggle("tagSectionItemActive");
      }
      parent.postMessage(
        { pluginMessage: { type: "tag", payload: type } },
        "*"
      );
      currentTag = type;
    }

    const target = document.getElementById(type);
    target.classList.toggle("tagSectionItemActive");
  }

  function showInfoMessage(message, disappear) {
    let currentMessage = infoMessage.innerText;
    infoMessage.innerText = message;

    if (disappear) {
      setTimeout(() => {
        infoMessage.innerText = currentMessage;
      }, 1200);
    }
  }

  function switchTab(tab) {
    if (tab === "generate") {
      generateTab.style.display = "block";
      stylesTab.style.display = "none";
      document.getElementById("generateTabItem").classList.add("active");
      document.getElementById("stylesTabItem").classList.remove("active");
    } else {
      generateTab.style.display = "none";
      stylesTab.style.display = "block";
      stylesTab.classList.add("active");
      document.getElementById("stylesTabItem").classList.add("active");
      document.getElementById("generateTabItem").classList.remove("active");
    }
  }

  const unsecuredCopyToClipboard = (text) => {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand("copy");
    } catch (err) {
      console.error("Unable to copy to clipboard", err);
    }
    document.body.removeChild(textArea);
  };

  function group() {
    parent.postMessage({ pluginMessage: { type: "group", payload: "" } }, "*");
  }

  function addAutoLayout() {
    parent.postMessage(
      { pluginMessage: { type: "auto-layout", payload: "" } },
      "*"
    );
  }

      // Convert the Uint8Array to a Blob
      const blob = new Blob([figmaExportedUint8Array], {
        type: "image/png",

      // Create a FileReader to read the Blob as a data URL
      const reader = new FileReader();

        // The result is the base64 data URL
        const base64Image = reader.result;

        console.log(base64Image);
      };

      // Read the Blob as a data URL
      reader.readAsDataURL(blob);

      return base64Image;
    });
    */

  function imageExport(payload) {
    const figmaExportedUint8Array =
      payload.bytes; /* Your Uint8Array data here */

    // Convert the Uint8Array to a Blob
    const blob = new Blob([figmaExportedUint8Array], {
      type: "image/png",

    // Create a FileReader to read the Blob as a data URL
    const reader = new FileReader();

    reader.onload = function () {
      // The result is the base64 data URL

    // Read the Blob as a data URL
    reader.readAsDataURL(blob);
